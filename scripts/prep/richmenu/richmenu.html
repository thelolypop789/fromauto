<!doctype html>
<!-- Rich Menu ของ LINE OA (2500×1686, 6 ปุ่ม 3×2): การ์ดแดงเลือดหมู ปุ่มแรกสีทอง มีมาสคอต (src/prep/mascot) ที่ปุ่มซื้อและปุ่มแอดมิน
     เรนเดอร์เป็น JPG ด้วย render.cjs; การกระทำของแต่ละปุ่มอยู่ใน richmenu.json -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 2500px; height: 1686px; background: #4A0B16; font-family: "Prompt", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; gap: 14px; padding: 14px; }
  .t { border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px;
       background: radial-gradient(120% 120% at 100% 0%, #A3263B 0%, #8E1B2E 45%, #6E1423 100%); color: #FFF7E6; position: relative; overflow: hidden;
       box-shadow: inset 0 0 0 3px rgba(212, 175, 55, .45); }
  .t.gold { background: linear-gradient(160deg, #F6DE8D, #E5BE4E 55%, #C9A227); color: #4A0B16; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45); gap: 6px; }
  .t svg { width: 230px; height: 230px; }
  .t b { font-size: 112px; font-weight: 700; line-height: 1.05; }
  .t small { font-size: 60px; font-weight: 500; opacity: .92; line-height: 1.2; }
  .t.gold small { opacity: 1; color: #6E1423; }
  .mascot { filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .35)); }
  .gold .mascot { width: 400px; height: 400px; margin-top: 40px; -webkit-mask-image: radial-gradient(circle at 50% 52%, #000 58%, transparent 71%); mask-image: radial-gradient(circle at 50% 52%, #000 58%, transparent 71%); filter: drop-shadow(0 18px 22px rgba(110, 20, 35, .35)); }
  .wave { width: 290px; height: 290px; }
  .badge { position: absolute; top: 40px; right: 44px; font-size: 52px; font-weight: 600; padding: 8px 30px; border-radius: 99px; background: #6E1423; color: #F3D98A; }
  /* ประกายทองเล็ก ๆ ให้การ์ดแดงไม่เรียบเกินไป */
  .t:not(.gold)::before { content: ""; position: absolute; width: 520px; height: 520px; right: -200px; top: -230px; border-radius: 50%;
       background: radial-gradient(circle, rgba(243, 217, 138, .22), rgba(243, 217, 138, 0) 65%); }
</style>
</head>
<body>
<div class="grid">
  <div class="t gold">
    <span class="badge">แนบสลิปที่นี่</span>
    <img class="mascot" src="../../../src/prep/mascot/teacher-cheer.webp" alt="">
    <b>ซื้อแพ็ก</b><small>เปิดใน Safari / Chrome</small>
  </div>
  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
    <b>ราคา</b><small>แพ็กทั้งหมด + โค้ดลด</small>
  </div>
  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.3c3 .3 5.5 2.6 5.5 5.7"/></svg>
    <b>ซื้อกลุ่ม</b><small>2 คน -20% · 5 คน -30%</small>
  </div>
  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h13"/><path d="m8.5 10 2 2 4-4"/></svg>
    <b>เข้าแอป</b><small>ลองฝึกฟรี 3 ชุด</small>
  </div>
  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8.5v5M9.5 11h5"/><path d="M10.5 18.5h3"/></svg>
    <b>เพิ่มลงหน้าจอ</b><small>ไม่ต้องโหลดจาก Store</small>
  </div>
  <div class="t">
    <img class="mascot wave" src="../../../src/prep/mascot/none-wave.webp" alt="">
    <b>คุยกับแอดมิน</b><small>สลิป · สิทธิ์ · ล็อกอิน</small>
  </div>
</div>
</body>
</html>

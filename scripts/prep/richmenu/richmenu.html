<!doctype html>
<!-- Rich Menu ของ LINE OA (2500×1686, 6 ปุ่ม 3×2) ในธีมเดียวกับแอป (src/prep/prep.css): พื้นครีม การ์ดขาว ไอคอนในวงสีเลือดหมูอ่อน
     ปุ่มแรกเป็นการ์ด hero สีเลือดหมูขอบทองพร้อมมาสคอต เรนเดอร์เป็น JPG ด้วย render.cjs; การกระทำของแต่ละปุ่มอยู่ใน richmenu.json -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #FBF7F1; --card: #FFFFFF; --line: #EADFD8; --ink: #2A1418; --muted: #7A6468; --primary: #8E1B2E; --primary-dark: #6E1423;
          --deep: #4A0B16; --soft: #F8ECEE; --gold-soft: #FBF3DC; --gold-line: linear-gradient(90deg, #B8860B, #F3D98A 45%, #C9A227 70%, #8C6A12); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 2500px; height: 1686px; background: var(--bg); font-family: "Prompt", sans-serif; color: var(--ink); position: relative; overflow: hidden; }
  body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 14px; background: var(--gold-line); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; gap: 34px; padding: 48px 34px 34px; }
  .t { position: relative; border-radius: 64px; background: var(--card); border: 3px solid var(--line);
       box-shadow: 0 4px 8px rgba(74, 11, 22, .05), 0 30px 60px -30px rgba(74, 11, 22, .28);
       display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
  .chip { width: 270px; height: 270px; border-radius: 50%; background: var(--soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 6px; }
  .chip.gold { background: var(--gold-soft); color: #8C6A12; }
  .chip svg { width: 150px; height: 150px; }
  .t b { font-size: 104px; font-weight: 700; line-height: 1.05; color: var(--primary-dark); }
  .t small { font-size: 58px; font-weight: 500; color: var(--muted); line-height: 1.2; }
  /* ปุ่มแรก: การ์ด hero แบบหน้าแรกของแอป */
  .hero { color: #fff; border: 3px solid rgba(212, 175, 55, .7); overflow: hidden;
          background: radial-gradient(120% 140% at 100% 0%, #A3263B 0%, var(--primary-dark) 50%, var(--deep) 100%);
          box-shadow: 0 40px 80px -40px rgba(74, 11, 22, .7); justify-content: center; gap: 0; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--gold-line); }
  .hero b { color: #fff; font-size: 108px; }
  .hero small { color: #F3D98A; margin-top: 14px; }
  .hero img { width: 270px; height: 270px; margin-bottom: 4px; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .35)); }
  .btn { margin-top: 34px; padding: 20px 60px; border-radius: 99px; font-size: 62px; font-weight: 700; color: var(--deep);
         background: linear-gradient(180deg, #F6DE8D, #D4AF37 60%, #B8860B); box-shadow: 0 16px 30px -14px rgba(0, 0, 0, .55), inset 0 3px 0 rgba(255, 255, 255, .5); }
</style>
</head>
<body>
<div class="grid">
  <div class="t hero">
    <img src="../../../public/prep/welcome/img/mascot-teacher-cheer.webp" alt="">
    <b>ซื้อแพ็ก</b>
    <small>เปิดใน Safari / Chrome</small>
    <span class="btn">แนบสลิปที่นี่</span>
  </div>
  <div class="t">
    <span class="chip gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
    <b>ราคา</b><small>แพ็กทั้งหมด + โค้ดลด</small>
  </div>
  <div class="t">
    <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.3c3 .3 5.5 2.6 5.5 5.7"/></svg></span>
    <b>ซื้อกลุ่ม</b><small>2 คน -20% · 5 คน -30%</small>
  </div>
  <div class="t">
    <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h13"/><path d="m8.5 10 2 2 4-4"/></svg></span>
    <b>เข้าแอป</b><small>ลองฝึกฟรี 3 ชุด</small>
  </div>
  <div class="t">
    <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8.5v5M9.5 11h5"/><path d="M10.5 18.5h3"/></svg></span>
    <b>เพิ่มลงหน้าจอ</b><small>ไม่ต้องโหลดจาก Store</small>
  </div>
  <div class="t">
    <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></span>
    <b>คุยกับแอดมิน</b><small>สลิป · สิทธิ์ · ล็อกอิน</small>
  </div>
</div>
</body>
</html>

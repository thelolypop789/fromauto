<!doctype html>
<!-- Rich Menu ของ LINE OA (2500×1686, 6 ปุ่ม) — เรนเดอร์เป็น PNG ด้วย render.js; การกระทำของแต่ละปุ่มอยู่ใน richmenu.json -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 2500px; height: 1686px; background: #5E0F1D; font-family: "Prompt", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; gap: 14px; padding: 14px; }
  .t { border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 34px;
       background: linear-gradient(160deg, #9E2236, #7A1527); color: #FFF7E6; position: relative; }
  .t.gold { background: linear-gradient(160deg, #F3D98A, #D9A52B); color: #5E0F1D; }
  .t svg { width: 250px; height: 250px; }
  .t b { font-size: 112px; font-weight: 700; line-height: 1.05; }
  .t small { font-size: 62px; font-weight: 500; opacity: .9; line-height: 1.2; }
  .badge { position: absolute; top: 44px; right: 48px; font-size: 52px; font-weight: 600; padding: 8px 30px; border-radius: 99px; background: #5E0F1D; color: #F3D98A; }
</style>
</head>
<body>
<div class="grid">

    <b>ราคา</b><small>แพ็กทั้งหมด + โค้ดส่วนลด</small>
  </div>
  <div class="t">

  </div>
  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/><path d="m7 9 1.5 1.5L11 8"/></svg>

  <div class="t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12Z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>

</html>
